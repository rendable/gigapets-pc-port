name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: GigaPetsPC-windows
          path: |
            build/Release/GigaPetsPC.exe
            build/Release/resources
